<main><h1>コードの一歩</h1><p>「分かるけど書けない」から、自分で書けるへ。</p>
<details><summary>変数と関数の違い</summary><p><strong>変数：値を保存する場所</strong></p><pre>int answer = 6;</pre><p>answer は整数を保存する変数です。ここでは 6 を保存しています。</p><p><strong>関数：処理をまとめたもの</strong></p><pre>int answer = sum(3);</pre><p>sum に 3 を渡すと、返ってきた合計の 6 が変数 answer に入ります。</p></details>
<h2>問題文</h2><label>取り組む問題 <select id="problem"></select></label><p id="description"></p>
<details><summary>ヒントを見る</summary><div id="hint-panel"></div></details>
<details><summary>関数全体の穴埋めで練習する</summary><pre id="template"></pre><div class="grid" id="blanks"></div><p><button id="grade">穴埋め問題を採点する</button></p><div id="practice" aria-live="polite"></div></details>
<h2>関数を書く</h2><p id="instructions"></p><div id="editor" aria-label="Cコードの入力欄"></div><p>Cコードの実行テストはローカル版で利用できます。</p></main>
